# Dependabot configuration.
#
# Mirrors BrainCOGS/U19-pipeline-python/.github/dependabot.yml (keep in sync
# when changing policy). Every ecosystem has a 7-day cooldown so a freshly
# published (possibly compromised) release is not proposed right away.
#
# No `docker` entry: this repo has no Dockerfile.

version: 2

updates:
  #
  # GitHub Actions
  #
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "ci"

    rebase-strategy: "auto"

    # A group without `applies-to` only batches scheduled version updates.
    # Security updates are grouped separately, so declare both or the
    # security fixes keep arriving as one PR per package.
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  #
  # Python / uv
  #
  - package-ecosystem: "uv"
    directory: "/"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "wednesday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      prefix: "deps"

    rebase-strategy: "auto"

    # See the github-actions entry above: version and security updates are
    # grouped independently, so both need a group.
    groups:
      python:
        applies-to: "version-updates"
        patterns:
          - "*"
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"

    ignore:
      # datajoint 2.x renamed its config file to datajoint.json and ignores the
      # dj_local_conf.json that the BrainCOGS repos ship, so a 2.x bump breaks
      # every deployment. pyproject.toml pins datajoint<2.0 for the same
      # reason. Remove once the datajoint 2.x migration lands.
      - dependency-name: "datajoint"
        versions:
          - ">=2.0"
      # datajoint <2.0 imports pkg_resources (plugin.py, pulled in by
      # connection.py on every `import datajoint`). setuptools 83.0.0 removed
      # pkg_resources outright and there is no installable replacement, so any
      # bump to >=82 makes `import datajoint` fail with ModuleNotFoundError.
      # Verified in tech_calendar_streamlit#110. Remove together with the
      # datajoint ignore above.
      - dependency-name: "setuptools"
        versions:
          - ">=82"
