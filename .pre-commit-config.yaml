# Run with prek (`uvx prek run --all-files`) or pre-commit.
#
# This repo is mostly MATLAB. The vendored MATLAB toolboxes and binary files
# below are never touched by any hook, so third-party code stays byte-identical.
exclude: |
  (?x)^(
    mym-mariadbconn/|
    modDataJoint/|
    GHToolbox/|
    compareVersions/|
    dirwalk/|
    @RecordingProcessJobGUI/|
    PythonScripts/__pycache__/|
    .*\.(mat|mlapp|fig|p|png|ico|pyc|prj)$
  )

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: "v6.0.0"
  hooks:
    - id: check-added-large-files
    - id: check-case-conflict
    - id: check-merge-conflict
    - id: check-symlinks
    # Enviblenv.yml is a legacy conda env file with inconsistent indentation
    # that is not valid YAML; left as is.
    - id: check-yaml
      exclude: ^Enviblenv\.yml$
    - id: check-toml
    - id: debug-statements
    - id: end-of-file-fixer
    - id: mixed-line-ending
    - id: trailing-whitespace
    # tests/ holds MATLAB suites (TestFoo.m) next to the pytest files, so
    # name-tests-test is limited to Python files.
    - id: name-tests-test
      args: ["--pytest-test-first"]
      files: ^(tests|PythonScripts/tests)/.*\.py$

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: "v0.16.10"
  hooks:
    - id: ruff-check
      types_or: [python, pyi]
      args: ["--fix", "--show-fixes"]
    - id: ruff-format
      types_or: [python, pyi]

- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
    - id: gitleaks

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.1
  hooks:
    - id: zizmor

- repo: https://github.com/astral-sh/uv-pre-commit
  rev: "0.12.22"
  hooks:
    - id: uv-lock

- repo: https://github.com/abravalheri/validate-pyproject
  rev: "0.26"
  hooks:
    - id: validate-pyproject
