name: iblenv
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
    - apptools >=4.5.0
    - boto3
    - click
    - colorcet
    - colorlog
    - cython
    - datajoint==0.14.10
    - flake8
    - globus-sdk
    - graphviz
    - h5py
    - ibl-neuropixel
    - ibllib
    - iblutil
    - jupyter
    - jupyterlab
    - matplotlib
    - mtscomp
    - nbformat
    - numba
    - numpy
    - opencv-python # macOS 10.13 and prior are incompatible with modern versions of opencv
    - ONE-api
    - pandas
    - phylib
    - pillow
    - plotly
    - pyarrow
    - pyflakes >= 2.4.0
    - pynrrd
    - pyopengl
    - PyQt5>=5.15
    - pyqtgraph
    - pytest
    - requests
    - scikits-bootstrap
    - scikit-learn
    - scipy >=1.4.1
    - seaborn
    - SimpleITK
    - soundfile
    - sphinx_gallery
    - statsmodels
    - tqdm
    - easyqc
    - git+https://github.com/BrainCOGS/iblapps.git
